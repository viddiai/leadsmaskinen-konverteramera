[phases.setup]
nixPkgs = ["python311", "gcc"]
# Systembibliotek som Chromium (Playwright) behöver — installeras av nixpacks
# via apt i setup-fasen. Manuellt apt-get i install-fasen fungerar inte.
aptPkgs = [
    "libnss3", "libnspr4", "libatk1.0-0", "libatk-bridge2.0-0",
    "libcups2", "libdrm2", "libdbus-1-3", "libxkbcommon0",
    "libatspi2.0-0", "libxcomposite1", "libxdamage1", "libxfixes3",
    "libxrandr2", "libgbm1", "libasound2", "libpango-1.0-0",
    "libcairo2", "libx11-6", "libxcb1", "libxext6",
]

[phases.install]
cmds = [
    "python -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt",
    # Chromium-binären för JS-rendering. Fast browserpath så runtime hittar den.
    ". /opt/venv/bin/activate && PLAYWRIGHT_BROWSERS_PATH=/opt/playwright playwright install chromium",
]

[phases.build]
cmds = ["echo 'Build complete'"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/opt/playwright"

[start]
cmd = ". /opt/venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
